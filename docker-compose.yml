services:
  postgres:
    image: postgres:16-alpine
    container_name: yoorasarah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yoorasarah
      POSTGRES_PASSWORD: yoorasarah
      POSTGRES_DB: yoorasarah
    ports:
      - "5432:5432"
    volumes:
      - yoorasarah-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: yoorasarah-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - yoorasarah-redis:/data

volumes:
  yoorasarah-postgres:
  yoorasarah-redis:
